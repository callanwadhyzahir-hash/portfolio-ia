<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes orbit {
        0% { transform: rotate(0deg); transform-origin: center; }
        100% { transform: rotate(360deg); transform-origin: center; }
      }
      .orbit-ring {
        animation: orbit 20s linear infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .glow-sphere {
        animation: pulse-glow 3s ease-in-out infinite;
      }
    </style>
    <radialGradient id="sphereGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#42a5f5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1e88e5;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- FONDO SUAVE -->
  <rect width="200" height="200" fill="none" opacity="0"/>
  
  <!-- GLOW EXTERNO -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)" opacity="0.8"/>
  
  <!-- ESFERA PRINCIPAL -->
  <circle cx="100" cy="100" r="80" fill="url(#sphereGradient)" class="glow-sphere"/>
  
  <!-- BRILLO ESPECULAR -->
  <ellipse cx="65" cy="65" rx="25" ry="28" fill="white" opacity="0.25"/>
  
  <!-- ANILLOS ORBITALES -->
  <g class="orbit-ring" opacity="0.6">
    <ellipse cx="100" cy="100" rx="90" ry="30" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3"/>
  </g>
  
  <g class="orbit-ring" opacity="0.4" style="animation-duration: 25s; animation-direction: reverse;">
    <ellipse cx="100" cy="100" rx="75" ry="45" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  </g>
  
  <!-- PUNTOS DE DATOS -->
  <circle cx="140" cy="90" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="110" cy="130" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="75" cy="110" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="95" cy="75" r="2.5" fill="#fbbf24" opacity="0.7"/>
  
  <!-- LÍNEAS DE CONEXIÓN SUAVES -->
  <path d="M 140 90 Q 120 100 110 130" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  <path d="M 110 130 Q 85 120 75 110" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  <path d="M 75 110 Q 80 85 95 75" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  <path d="M 95 75 Q 120 80 140 90" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  
  <!-- TEXTO "ATLAS" -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="2">
    ATLAS
  </text>
</svg>